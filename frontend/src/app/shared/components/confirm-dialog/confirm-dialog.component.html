<div class="modal" (click)="cancel.emit()">
  <div
    (click)="$event.stopPropagation()"
    class="modal-content w-[400px] max-w-[90vw]"
  >
    <div class="flex items-start gap-4 p-6">
      <div
        class="shrink-0 w-10 h-10 rounded-full flex items-center justify-center bg-red-900/30 text-red-400"
      >
        <span class="material-symbols-outlined">warning</span>
      </div>

      <div class="flex-1">
        <h3 class="text-lg font-bold text-white">
          {{ title }}
        </h3>
        <p class="text-slate-300 text-sm mt-2 leading-relaxed">
          {{ message }}
        </p>
      </div>
    </div>

    <div class="modal-footer">
      <button (click)="cancel.emit()" class="btn btn-ghost">
        {{ cancelText }}
      </button>

      <button
        (click)="confirm.emit()"
        class="btn"
        [class.btn-danger]="type === 'danger'"
        [class.btn-primary]="type === 'info'"
      >
        {{ confirmText }}
      </button>
    </div>
  </div>
</div>
