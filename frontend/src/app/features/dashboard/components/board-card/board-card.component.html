<div
  class="group h-full bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 shadow-sm hover:shadow-md transition-all relative overflow-visible flex flex-col cursor-pointer"
  (click)="cardClick.emit(board)"
  (mouseleave)="menuOpen.set(false)"
>
  <div
    class="absolute left-0 top-0 bottom-0 w-1.5 bg-primary group-hover:w-2 transition-all rounded-l-xl"
  ></div>

  <div class="p-6 flex-1">
    <div class="flex justify-between items-start mb-4 relative">
      <h3
        class="text-lg font-bold text-slate-900 dark:text-white group-hover:text-primary transition-colors"
      >
        {{ board.title }}
      </h3>

      <div class="relative">
        <button
          (click)="toggleMenu($event)"
          class="w-8 h-8 flex items-center justify-center rounded-full text-slate-400 hover:text-slate-600 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors"
        >
          <span class="material-symbols-outlined text-[20px]">more_vert</span>
        </button>

        <div
          *ngIf="menuOpen()"
          class="absolute right-0 top-8 w-40 bg-white dark:bg-slate-800 rounded-lg shadow-xl border border-slate-200 dark:border-slate-700 z-50 overflow-hidden animation-fade-in"
        >
          <button
            (click)="
              $event.stopPropagation(); edit.emit(board); menuOpen.set(false)
            "
            class="w-full text-left px-4 py-2 text-sm text-slate-700 dark:text-slate-200 hover:bg-slate-50 dark:hover:bg-slate-700 flex items-center gap-2"
          >
            <span class="material-symbols-outlined text-[18px]">edit</span>
            Edit
          </button>

          <button
            (click)="
              $event.stopPropagation(); delete.emit(board); menuOpen.set(false)
            "
            class="w-full text-left px-4 py-2 text-sm text-red-600 hover:bg-red-50 dark:hover:bg-red-900/20 flex items-center gap-2"
          >
            <span class="material-symbols-outlined text-[18px]">delete</span>
            Delete
          </button>
        </div>
      </div>
    </div>

    <p class="text-slate-500 dark:text-slate-400 text-sm mt-2 line-clamp-3">
      {{ board.description || 'No description provided for this board.' }}
    </p>
  </div>

  <div
    class="mt-auto p-6 pt-0 flex items-center justify-between border-t border-slate-50 dark:border-slate-800/50 pt-4"
  >
    <div class="flex items-center gap-2 text-slate-400">
      <span class="material-symbols-outlined text-[16px]">calendar_today</span>
      <span class="text-[11px] font-medium uppercase tracking-wider">
        {{ board.createdAt | date: 'mediumDate' }}
      </span>
    </div>
    <span
      class="px-2.5 py-1 bg-primary/10 text-primary text-[11px] font-bold rounded-full"
    >
      {{ taskCount }} TASKS
    </span>
  </div>
</div>
