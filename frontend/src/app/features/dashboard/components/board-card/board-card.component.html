<div
  class="group h-full bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 shadow-sm hover:shadow-md transition-all relative overflow-hidden flex flex-col cursor-pointer"
  (click)="cardClick.emit(board)"
>
  <div
    class="absolute left-0 top-0 bottom-0 w-1.5 bg-primary group-hover:w-2 transition-all"
  ></div>

  <div class="p-6 flex-1">
    <div class="flex justify-between items-start mb-4">
      <h3
        class="text-lg font-bold text-slate-900 dark:text-white group-hover:text-primary transition-colors"
      >
        {{ board.name }}
      </h3>

      <button
        mat-icon-button
        [matMenuTriggerFor]="menu"
        (click)="$event.stopPropagation()"
        class="!w-8 !h-8 flex items-center justify-center text-slate-400 hover:text-slate-600"
      >
        <span class="material-symbols-outlined text-[20px]">more_vert</span>
      </button>
    </div>

    <p class="text-slate-500 dark:text-slate-400 text-sm mt-2 line-clamp-3">
      {{ board.description || 'No description provided for this board.' }}
    </p>
  </div>

  <div
    class="mt-auto p-6 pt-0 flex items-center justify-between border-t border-slate-50 dark:border-slate-800/50 pt-4"
  >
    <div class="flex items-center gap-2 text-slate-400">
      <span class="material-symbols-outlined text-[16px]">calendar_today</span>
      <span class="text-[11px] font-medium uppercase tracking-wider">
        {{ board.createdAt | date: 'mediumDate' }}
      </span>
    </div>
    <span
      class="px-2.5 py-1 bg-primary/10 text-primary text-[11px] font-bold rounded-full"
    >
      {{ board.taskCount || 0 }} TASKS
    </span>
  </div>
</div>

<mat-menu #menu="matMenu">
  <button mat-menu-item (click)="edit.emit(board)">
    <span class="material-symbols-outlined mr-2">edit</span>
    <span>Edit</span>
  </button>
  <button mat-menu-item (click)="delete.emit(board)" class="!text-red-600">
    <span class="material-symbols-outlined mr-2">delete</span>
    <span>Delete</span>
  </button>
</mat-menu>
