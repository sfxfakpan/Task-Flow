<div class="modal" (click)="close.emit()">
  <div
    (click)="$event.stopPropagation()"
    class="modal-content w-[500px] max-w-[95vw]"
  >
    <div class="modal-header">
      <h2 class="text-xl font-bold text-white m-0">
        {{ isEditMode() ? 'Edit Board' : 'Create New Board' }}
      </h2>
      <button
        (click)="close.emit()"
        class="text-slate-400 hover:text-slate-200 transition-colors p-1"
      >
        <span class="material-symbols-outlined">close</span>
      </button>
    </div>

    <form
      [formGroup]="boardForm"
      (ngSubmit)="onSubmit()"
      class="modal-body space-y-5"
    >
      <div>
        <label class="block text-sm font-medium text-slate-300 mb-2">
          Board Title <span class="text-red-500">*</span>
        </label>
        <input
          type="text"
          formControlName="title"
          placeholder="e.g., Marketing Campaign Q1"
          class="form-input"
          [class.border-red-500]="
            hasError('title', 'required') || hasError('title', 'maxlength')
          "
        />
        <div class="flex justify-between mt-2">
          <span class="text-xs text-red-500 h-4">
            <span *ngIf="hasError('title', 'required')"
              >Title is required.</span
            >
            <span *ngIf="hasError('title', 'maxlength')"
              >Max 100 characters.</span
            >
          </span>
          <span class="text-xs text-slate-400">
            {{ boardForm.get('title')?.value?.length || 0 }}/100
          </span>
        </div>
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-300 mb-2">
          Description <span class="text-slate-400 font-normal">(Optional)</span>
        </label>
        <textarea
          formControlName="description"
          rows="4"
          placeholder="What is this project about?"
          class="form-input resize-none"
          [class.border-red-500]="hasError('description', 'maxlength')"
        ></textarea>
        <div class="text-right mt-2">
          <span
            class="text-xs text-slate-400"
            [class.text-red-500]="hasError('description', 'maxlength')"
          >
            {{ boardForm.get('description')?.value?.length || 0 }}/500
          </span>
        </div>
      </div>

      <div class="modal-footer">
        <button type="button" (click)="close.emit()" class="btn btn-ghost">
          Cancel
        </button>
        <button
          type="submit"
          [disabled]="boardForm.invalid || isSubmitting()"
          class="btn btn-primary disabled:opacity-50 disabled:cursor-not-allowed flex items-center gap-2"
        >
          <span
            *ngIf="isSubmitting()"
            class="material-symbols-outlined animate-spin text-sm"
            >progress_activity</span
          >
          {{ isEditMode() ? 'Save Changes' : 'Create Board' }}
        </button>
      </div>
    </form>
  </div>
</div>
