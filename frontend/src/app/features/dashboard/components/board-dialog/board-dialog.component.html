<div
  class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center animation-fade-in"
  (click)="close.emit()"
>
  <div
    (click)="$event.stopPropagation()"
    class="bg-white dark:bg-slate-900 rounded-xl shadow-2xl w-[500px] max-w-[95vw] overflow-hidden border border-slate-200 dark:border-slate-800 animation-slide-up"
  >
    <div
      class="px-6 py-4 border-b border-slate-100 dark:border-slate-800 flex justify-between items-center"
    >
      <h2 class="text-xl font-bold text-slate-900 dark:text-white">
        {{ isEditMode() ? 'Edit Board' : 'Create New Board' }}
      </h2>
      <button
        (click)="close.emit()"
        class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition-colors"
      >
        <span class="material-symbols-outlined">close</span>
      </button>
    </div>

<mat-dialog-content>
  <form [formGroup]="form" class="flex flex-col gap-4 py-4 w-full max-w-md">
    <mat-form-field appearance="outline" class="w-full">
      <mat-label>Board Name</mat-label>
      <input matInput formControlName="name" placeholder="e.g. Project Alpha" />
      <mat-error *ngIf="form.get('name')?.hasError('required')">
        Board name is required
      </mat-error>
      <mat-error *ngIf="form.get('name')?.hasError('minlength')">
        Must be at least 3 characters
      </mat-error>
    </mat-form-field>

      <div>
        <label
          class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1"
        >
          Description <span class="text-slate-400 font-normal">(Optional)</span>
        </label>
        <textarea
          formControlName="description"
          rows="4"
          placeholder="What is this project about?"
          class="w-full px-4 py-2 rounded-lg border bg-white dark:bg-slate-950 text-slate-900 dark:text-white focus:ring-2 focus:ring-primary/50 outline-none transition-all resize-none"
          [class.border-slate-300]="!hasError('description', 'maxlength')"
          [class.dark:border-slate-700]="!hasError('description', 'maxlength')"
          [class.border-red-500]="hasError('description', 'maxlength')"
        ></textarea>
        <div class="text-right mt-1">
          <span
            class="text-xs text-slate-400"
            [class.text-red-500]="hasError('description', 'maxlength')"
          >
            {{ boardForm.get('description')?.value?.length || 0 }}/500
          </span>
        </div>
      </div>

      <div class="flex justify-end gap-3 pt-2">
        <button
          type="button"
          (click)="close.emit()"
          class="px-4 py-2 rounded-lg text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 font-medium transition-colors"
        >
          Cancel
        </button>
        <button
          type="submit"
          [disabled]="boardForm.invalid || isSubmitting()"
          class="px-6 py-2 rounded-lg bg-primary hover:bg-primary-dark text-white font-medium shadow-lg shadow-primary/30 transition-all disabled:opacity-50 disabled:cursor-not-allowed flex items-center gap-2"
        >
          <span
            *ngIf="isSubmitting()"
            class="material-symbols-outlined animate-spin text-sm"
            >progress_activity</span
          >
          {{ isEditMode() ? 'Save Changes' : 'Create Board' }}
        </button>
      </div>
    </form>
  </div>
</div>
