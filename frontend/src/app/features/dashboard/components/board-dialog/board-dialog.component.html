<h2 mat-dialog-title>{{ isEditMode ? 'Edit Board' : 'Create New Board' }}</h2>

<mat-dialog-content>
  <form [formGroup]="form" class="flex flex-col gap-4 py-4 w-full max-w-md">
    <mat-form-field appearance="outline" class="w-full">
      <mat-label>Board Name</mat-label>
      <input matInput formControlName="name" placeholder="e.g. Project Alpha" />
      <mat-error *ngIf="form.get('name')?.hasError('required')">
        Board name is required
      </mat-error>
      <mat-error *ngIf="form.get('name')?.hasError('minlength')">
        Must be at least 3 characters
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="w-full">
      <mat-label>Description (Optional)</mat-label>
      <textarea
        matInput
        formControlName="description"
        rows="4"
        placeholder="What is this board for?"
      ></textarea>
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end" class="gap-2">
  <button mat-button (click)="onCancel()">Cancel</button>
  <button
    mat-flat-button
    color="primary"
    (click)="onSubmit()"
    [disabled]="form.invalid"
  >
    {{ isEditMode ? 'Update Board' : 'Create Board' }}
  </button>
</mat-dialog-actions>
